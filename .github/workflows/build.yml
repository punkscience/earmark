name: Build APK

# CI runs on PRs for verification, and on manual dispatch for release builds.
# No push trigger — merges don't fire wasteful CI runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: earmarks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish a Release with the APK — only on manual dispatch, not PR checks.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Earmarks build ${{ github.run_number }}" \
            --notes "Automated debug build from ${{ github.sha }}. Download \`app-debug.apk\` and sideload it (enable install from unknown sources)." \
            --prerelease

      # Deliver APK directly to Darryl on Telegram — tap to install.
      - name: Send to Telegram
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@app/build/outputs/apk/debug/app-debug.apk \
            -F caption="🎵 Earmarks build ${{ github.run_number }} — tap to install"

      # Purge old releases to stay under the 0.5GB free-tier storage cap.
      # Keeps only the latest release.
      - name: Purge old releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[1:].[].tagName' | xargs -r -n1 gh release delete --cleanup-tag -y